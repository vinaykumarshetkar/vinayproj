apiVersion: apps/v1
kind: Deployment
metadata:
  name: vinayproj
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vinayproj
  template:
    metadata:
      labels:
        app: vinayproj
    spec:
      containers:
        - name: vinayproj
          image: aks3vinayproj.azurecr.io/vinayproj:3.4
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
