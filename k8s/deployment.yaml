apiVersion: apps/v1
kind: Deployment
metadata:
  name: vinayproj1
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vinayproj1
  template:
    metadata:
      labels:
        app: vinayproj1
    spec:
      containers:
        - name: vinayproj1
          image: aks3vinayproj.azurecr.io/vinayproj:3.4
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
